; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only; the host tests run with `pio test -e native`.
default_envs = d1_mini_lite

[env:d1_mini_lite]
platform = espressif8266
board = d1_mini_lite
framework = arduino

; Wi-Fi network, AZBA zone and backend URL are entered in the captive portal at
; first boot and stored in flash: nothing to configure before building.
; extra/version.py stamps the firmware version (git describe, or FW_VERSION).
extra_scripts = pre:extra/version.py

; LittleFS holds the settings (/config.json) and the double-reset marker.
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^6.21.0
    tzapu/WiFiManager @ ^2.0.17

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Host-side unit tests of lib/AzbaConfig (zone and URL rules).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11
